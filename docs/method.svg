<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="Method of measurement in four steps: fork snapshot, seed known state, three parallel browsers, check predicates" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Method of measurement</title>
<desc>Four steps: fork a sandbox from a pinned snapshot, seed known backend state, run the reported steps in three parallel browsers, check concrete predicates against that state.</desc>
<style>
.pg{fill:#EFEBE3}
.ink{fill:#171412}
.gr{fill:#55504A}
.br{fill:#7A6A3F}
.r2{stroke:#171412;stroke-width:2.5}
.r1{stroke:#171412;stroke-width:0.8}
.hr{stroke:#C4BCAF;stroke-width:0.8}
.n{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700}
.t{font-family:Georgia,'Times New Roman',serif;font-size:10px;font-weight:700;letter-spacing:1.4px}
.b{font-family:Georgia,'Times New Roman',serif;font-size:11px}
.l{font-family:Georgia,'Times New Roman',serif;font-size:9px;font-weight:700;letter-spacing:1.6px}
</style>
<rect class="pg" x="0" y="0" width="880" height="216"/>
<line class="r2" x1="40" y1="24" x2="840" y2="24"/>
<text class="l br" x="40" y="44">METHOD OF MEASUREMENT</text>
<text class="l br" x="840" y="44" text-anchor="end">FOUR STEPS</text>
<line class="r1" x1="40" y1="54" x2="840" y2="54"/>
<text class="n ink" x="40" y="88">01</text>
<line class="hr" x1="40" y1="98" x2="225" y2="98"/>
<text class="t ink" x="40" y="116">FORK SNAPSHOT</text>
<text class="b gr" x="40" y="134">A cloud sandbox is forked<tspan x="40" dy="14">from a snapshot of the app</tspan><tspan x="40" dy="14">at a pinned version, so every</tspan><tspan x="40" dy="14">run starts identical.</tspan></text>
<text class="n ink" x="245" y="88">02</text>
<line class="hr" x1="245" y1="98" x2="430" y2="98"/>
<text class="t ink" x="245" y="116">SEED KNOWN STATE</text>
<text class="b gr" x="245" y="134">Backend state is written<tspan x="245" dy="14">directly over OTLP, so the</tspan><tspan x="245" dy="14">run begins from facts the</tspan><tspan x="245" dy="14">harness put there itself.</tspan></text>
<text class="n ink" x="450" y="88">03</text>
<line class="hr" x1="450" y1="98" x2="635" y2="98"/>
<text class="t ink" x="450" y="116">THREE PARALLEL BROWSERS</text>
<text class="b gr" x="450" y="134">The reported steps are<tspan x="450" dy="14">carried out three times at</tspan><tspan x="450" dy="14">once, in three separate</tspan><tspan x="450" dy="14">isolated browsers.</tspan></text>
<text class="n ink" x="655" y="88">04</text>
<line class="hr" x1="655" y1="98" x2="840" y2="98"/>
<text class="t ink" x="655" y="116">CHECK PREDICATES</text>
<text class="b gr" x="655" y="134">Concrete predicates are<tspan x="655" dy="14">checked against backend</tspan><tspan x="655" dy="14">state. No model is asked</tspan><tspan x="655" dy="14">what happened.</tspan></text>
<line class="r1" x1="40" y1="196" x2="840" y2="196"/>
<line class="r2" x1="40" y1="201" x2="840" y2="201"/>
</svg>
