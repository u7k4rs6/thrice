<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="880" height="216" aria-label="Method of measurement in four steps: fork snapshot, seed known state, three parallel browsers, check predicates" role="img" viewBox="0 0 880 216"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Method of measurement</title><desc>Four steps: fork a sandbox from a pinned snapshot, seed known backend state, run the reported steps in three parallel browsers, check concrete predicates against that state.</desc><style>.pg{fill:#efebe3}.ink{fill:#171412}.gr{fill:#55504a}.br{fill:#7a6a3f}.r1,.r2{stroke:#171412}.r2{stroke-width:2.5}.hr,.r1{stroke-width:.8}.hr{stroke:#c4bcaf}.n{font-size:26px;font-weight:700}.b,.l,.n,.t{font-family:Georgia,&apos;Times New Roman&apos;,serif}.t{font-size:10px;font-weight:700;letter-spacing:1.4px}.b{font-size:11px}.l{font-size:9px;font-weight:700;letter-spacing:1.6px}</style><rect width="880" height="216" x="0" y="0" class="pg"/><line x1="40" x2="840" y1="24" y2="24" class="r2"/><text x="40" y="44" class="l br">METHOD OF MEASUREMENT</text><text x="840" y="44" class="l br" text-anchor="end">FOUR STEPS</text><line x1="40" x2="840" y1="54" y2="54" class="r1"/><text x="40" y="88" class="n ink">01</text><line x1="40" x2="225" y1="98" y2="98" class="hr"/><text x="40" y="116" class="t ink">FORK SNAPSHOT</text><text x="40" y="134" class="b gr">A cloud sandbox is forked<tspan x="40" dy="14">from a snapshot of the app</tspan><tspan x="40" dy="14">at a pinned version, so every</tspan><tspan x="40" dy="14">run starts identical.</tspan></text><text x="245" y="88" class="n ink">02</text><line x1="245" x2="430" y1="98" y2="98" class="hr"/><text x="245" y="116" class="t ink">SEED KNOWN STATE</text><text x="245" y="134" class="b gr">Backend state is written<tspan x="245" dy="14">directly over OTLP, so the</tspan><tspan x="245" dy="14">run begins from facts the</tspan><tspan x="245" dy="14">harness put there itself.</tspan></text><text x="450" y="88" class="n ink">03</text><line x1="450" x2="635" y1="98" y2="98" class="hr"/><text x="450" y="116" class="t ink">THREE PARALLEL BROWSERS</text><text x="450" y="134" class="b gr">The reported steps are<tspan x="450" dy="14">carried out three times at</tspan><tspan x="450" dy="14">once, in three separate</tspan><tspan x="450" dy="14">isolated browsers.</tspan></text><text x="655" y="88" class="n ink">04</text><line x1="655" x2="840" y1="98" y2="98" class="hr"/><text x="655" y="116" class="t ink">CHECK PREDICATES</text><text x="655" y="134" class="b gr">Concrete predicates are<tspan x="655" dy="14">checked against backend</tspan><tspan x="655" dy="14">state. No model is asked</tspan><tspan x="655" dy="14">what happened.</tspan></text><line x1="40" x2="840" y1="196" y2="196" class="r1"/><line x1="40" x2="840" y1="201" y2="201" class="r2"/></svg>