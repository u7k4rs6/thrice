.hr{stroke:#C4BCAF;stroke-width:0.8}
.bs{stroke:#7A6A3F;stroke-width:1.2}
.m{font-family:Georgia,'Times New Roman',serif;font-size:58px;font-weight:700;letter-spacing:1px}
.h{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;letter-spacing:0.5px}
.s{font-family:Georgia,'Times New Roman',serif;font-size:14px;font-style:italic}
.d{font-family:Georgia,'Times New Roman',serif;font-size:13px;font-style:italic}
.l{font-family:Georgia,'Times New Roman',serif;font-size:9px;font-weight:700;letter-spacing:1.6px}
</style>
<rect class="pg" x="0" y="0" width="880" height="368"/>
<line class="r2" x1="40" y1="28" x2="840" y2="28"/>
<line class="r1" x1="40" y1="33" x2="840" y2="33"/>
<text class="m ink" x="440" y="96" text-anchor="middle">thrice</text>
<text class="s gr" x="440" y="122" text-anchor="middle">Does this bug still happen? Answered by running it, three times, on both sides of the release that fixed it.</text>
<line class="r1" x1="40" y1="140" x2="840" y2="140"/>
<line class="hr" x1="240" y1="144" x2="240" y2="168"/>
<line class="hr" x1="440" y1="144" x2="440" y2="168"/>
<line class="hr" x1="640" y1="144" x2="640" y2="168"/>
<text class="l br" x="140" y="160" text-anchor="middle">VOL. I . . . NO. 1</text>
<text class="l br" x="340" y="160" text-anchor="middle">CORPUS: JAEGER-UI</text>
<text class="l br" x="540" y="160" text-anchor="middle">TWELVE ATTEMPTS PUBLISHED</text>
<text class="l br" x="740" y="160" text-anchor="middle">SEPTEMBER 2026</text>
<line class="r2" x1="40" y1="176" x2="840" y2="176"/>
<line class="r1" x1="40" y1="181" x2="840" y2="181"/>
<text class="h ink" x="440" y="226" text-anchor="middle">HARNESS REPORTS ITSELF</text>
<text class="h ink" x="440" y="264" text-anchor="middle"><tspan class="rd">WRONG TWICE</tspan> IN FIVE</text>
<line class="bs" x1="360" y1="282" x2="520" y2="282"/>
<text class="d gr" x="440" y="304" text-anchor="middle">Precision 0.80. Recall 0.80. Ground truth taken from the commit that fixed each bug.</text>
<line class="r1" x1="40" y1="322" x2="840" y2="322"/>
<line class="r2" x1="40" y1="327" x2="840" y2="327"/>
<text class="l br" x="40" y="348">BUILT ON SOLARI</text>
<text class="l br" x="440" y="348" text-anchor="middle">SANDBOX . SNAPSHOT . PREVIEW . BROWSER . SCREENCAST</text>
<text class="l br" x="840" y="348" text-anchor="end">NO MODEL IN THE RUN LOOP</text>
