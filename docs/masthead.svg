<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368" role="img" aria-label="thrice: does this bug still happen, answered by running it three times on both sides of the release that fixed it" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>thrice</title>
<desc>Newspaper masthead for thrice, a bug reproduction harness. Headline reads: harness reports itself wrong twice in five. Precision 0.80, recall 0.80.</desc>
<style>
.pg{fill:#EFEBE3}
.ink{fill:#171412}
.gr{fill:#55504A}
.rd{fill:#8C1D2B}
.br{fill:#7A6A3F}
