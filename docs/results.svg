<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424" role="img" aria-label="Record of attempts: six jaeger-ui issues with verdicts on the buggy and fixed release, three correct, two incorrect, one inconclusive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Record of attempts</title>
<desc>Six already-fixed jaeger-ui issues run on the last buggy release and the first fixed release. Three correct, two incorrect, one inconclusive. Precision 0.80, recall 0.80.</desc>
<style>
.pg{fill:#EFEBE3}
.ink{fill:#171412}
.gr{fill:#55504A}
.rd{fill:#8C1D2B}
.br{fill:#7A6A3F}
.r2{stroke:#171412;stroke-width:2.5}
.r1{stroke:#171412;stroke-width:0.8}
.hr{stroke:#C4BCAF;stroke-width:0.8}
.l{font-family:Georgia,'Times New Roman',serif;font-size:9px;font-weight:700;letter-spacing:1.6px}
.i{font-family:Georgia,'Times New Roman',serif;font-size:12px}
.v{font-family:Georgia,'Times New Roman',serif;font-size:9.5px;font-weight:700;letter-spacing:0.8px}
.p{font-family:'Courier New',monospace;font-size:10.5px}
.f{font-family:Georgia,'Times New Roman',serif;font-size:11px;font-style:italic}
</style>
<rect class="pg" x="0" y="0" width="880" height="424"/>
<line class="r2" x1="40" y1="24" x2="840" y2="24"/>
<text class="l br" x="40" y="44">RECORD OF ATTEMPTS</text>
<text class="l br" x="840" y="44" text-anchor="end">SIX ISSUES . TWELVE ATTEMPTS . SIXTY-THREE RUNS</text>
