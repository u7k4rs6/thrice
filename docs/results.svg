<text class="l gr" x="410" y="72">ON BUGGY</text>
<text class="l gr" x="580" y="72">ON FIXED</text>
<text class="l gr" x="750" y="72">RESULT</text>
<line class="r1" x1="40" y1="82" x2="840" y2="82"/>
<text class="i ink" x="40" y="108">#4075 back-to-search arrow</text>
<text class="p gr" x="250" y="108">2.19.0 &#8594; 2.20.0</text>
<text class="v ink" x="410" y="108">REPRODUCED</text>
<text class="v ink" x="580" y="108">NOT REPRODUCED</text>
<text class="v ink" x="750" y="108">CORRECT</text>
