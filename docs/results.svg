<text class="i rd" x="40" y="268">#3967 comparison selection</text>
<text class="p rd" x="250" y="268">2.18.0 &#8594; 2.19.0</text>
<text class="v rd" x="410" y="268">NOT REPRODUCED</text>
<text class="v rd" x="580" y="268">NOT REPRODUCED</text>
