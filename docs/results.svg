<line class="r1" x1="40" y1="322" x2="840" y2="322"/>
<line class="r2" x1="40" y1="327" x2="840" y2="327"/>
<text class="f ink" x="40" y="350">Three of five conclusive entries correct. Precision 0.80, recall 0.80. One entry never reached a verdict on the buggy side.</text>
<text class="f gr" x="40" y="370">Ground truth is the commit that fixed each issue. No entry was removed after its result was seen.</text>
<line class="hr" x1="40" y1="388" x2="840" y2="388"/>
<text class="l br" x="40" y="406">EVERY ATTEMPT PUBLISHED, INCLUDING THE TWO IT GOT WRONG</text>
