<text class="i ink" x="40" y="188">#3804 expander keyboard</text>
<text class="p gr" x="250" y="188">2.17.0 &#8594; 2.18.0</text>
<text class="v ink" x="410" y="188">REPRODUCED</text>
<text class="v ink" x="580" y="188">NOT REPRODUCED</text>
<text class="v ink" x="750" y="188">CORRECT</text>
<line class="hr" x1="40" y1="202" x2="840" y2="202"/>
